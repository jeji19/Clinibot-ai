name: Deploy CliniBot AI Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm that this run may deploy to the production Worker."
        type: boolean
        required: true
        default: false
      worker_name:
        description: "Must match the name in wrangler.jsonc."
        type: string
        required: true
        default: clinibot-ai1

permissions:
  contents: read

concurrency:
  group: clinibot-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WORKER_NAME: ${{ inputs.worker_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify target and credentials
        shell: bash
        run: |
          set -euo pipefail
          configured_name="$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')).name)")"
          if [[ "$WORKER_NAME" != "$configured_name" ]]; then
            echo "Refusing to deploy: input worker name does not match wrangler.jsonc." >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets before deploying." >&2
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal Cloudflare account ID." >&2
            exit 1
          fi
          echo "Validated production target: $configured_name and Cloudflare account ID format."

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke-test public clinic info and chat
        shell: bash
        run: |
          set -euo pipefail
          base="https://clinibot-ai1.albizrahemran.workers.dev"
          clinic="Clinibot-demo-2026-x93k"

          info="$(curl --silent --show-error --fail --max-time 30 "$base/api/public/clinic-info?clinic=$clinic")"
          echo "$info" | jq -e '.clinic.name and (.services | type == "array") and .currency_code == "USD"' >/dev/null

          chat="$(curl --silent --show-error --fail --max-time 30 \
            -H 'Content-Type: application/json' \
            -d "{\"message\":\"What services and prices do you offer?\",\"clinic_slug\":\"$clinic\"}" \
            "$base/api/chat")"
          echo "$chat" | jq -e '.reply | type == "string" and length > 0 and contains("$")' >/dev/null

      - name: Verify unpublished services cannot be booked
        shell: bash
        run: |
          set -euo pipefail
          base="https://clinibot-ai1.albizrahemran.workers.dev"
          clinic="Clinibot-demo-2026-x93k"
          preferred_date="$(date -u -d '+1 day' +%F)"
          status="$(curl --silent --show-error --max-time 30 \
            -o /tmp/clinibot-booking-smoke.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"patient_name\":\"Synthetic Smoke Test\",\"patient_phone\":\"+10000000000\",\"service\":\"__unpublished_smoke_test__\",\"preferred_date\":\"$preferred_date\",\"preferred_time\":\"10:00\",\"language\":\"en\",\"clinic_slug\":\"$clinic\"}" \
            "$base/api/appointment")"
          if [[ "$status" != "400" ]]; then
            cat /tmp/clinibot-booking-smoke.json
            echo "Expected unpublished service to be rejected with HTTP 400; received $status." >&2
            exit 1
          fi
          jq -e '.error | test("currently offered")' /tmp/clinibot-booking-smoke.json >/dev/null
