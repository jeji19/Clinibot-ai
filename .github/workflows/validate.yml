name: Validate JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and module syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
            count=$((count + 1))
          done < <(find src functions netlify/functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          test "$count" -gt 0
          echo "Syntax checks passed for $count JavaScript files."
      - name: Verify public API adapter wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/api/chat.js
          test -f functions/api/appointment.js
          test -f functions/api/public/clinic-info.js
          test -f functions/api/demo-request.js
          test -f netlify/functions/chat.mjs
          test -f netlify/functions/appointment.mjs
          test -f netlify/functions/clinic-info.mjs
          test -f netlify/functions/demo-request.mjs
          grep -Fq 'from = "/api/chat"' netlify.toml
          grep -Fq 'to = "/.netlify/functions/chat"' netlify.toml
          grep -Fq 'from = "/api/appointment"' netlify.toml
          grep -Fq 'to = "/.netlify/functions/appointment"' netlify.toml
          grep -Fq 'from = "/api/public/clinic-info"' netlify.toml
          grep -Fq 'to = "/.netlify/functions/clinic-info"' netlify.toml
          grep -Fq 'from = "/api/demo-request"' netlify.toml
          grep -Fq 'to = "/.netlify/functions/demo-request"' netlify.toml
          grep -Fq 'fetch("/api/demo-request"' public/landing.html
          echo "Cloudflare Pages, Netlify functions, and landing-form routes are wired."

      - name: Test demo request endpoints
        run: node --test tests/demo-request.test.mjs
      - name: Test appointment endpoints
        run: node --test tests/appointment.test.mjs
      - name: Test public clinic info endpoints
        run: node --test tests/clinic-info.test.mjs
      - name: Test clinic chat language and safety fallbacks
        run: node --test tests/chat.test.mjs
      - name: Test manager and Super Admin authorization
        run: node --test tests/admin-authz.test.mjs
      - name: Test baseline security safeguards
        run: node --test tests/security-basics.test.mjs
